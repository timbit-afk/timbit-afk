<svg xmlns="http://www.w3.org/2000/svg" width="840" height="310" viewBox="0 0 840 310" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="16">
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="c1"><rect x="40" y="62" height="26" width="0"><animate attributeName="width" from="0" to="120" begin="0.4s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="126" height="26" width="0"><animate attributeName="width" from="0" to="200" begin="2.0s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="190" height="26" width="0"><animate attributeName="width" from="0" to="260" begin="3.6s" dur="0.9s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="839" height="309" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="839" height="2" rx="1" fill="url(#bar)"/>
  <circle cx="24" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="6" fill="#febc2e"/>
  <circle cx="64" cy="24" r="6" fill="#28c840"/>
  <text x="420" y="29" text-anchor="middle" fill="#8b949e" font-size="13">tilegen@bishkek: ~</text>
  <line x1="0" y1="44" x2="840" y2="44" stroke="#21262d"/>

  <g clip-path="url(#c1)">
    <text x="40" y="80"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> whoami</tspan></text>
  </g>
  <text x="40" y="110" opacity="0">
    <tspan fill="#58a6ff" font-weight="bold">Tilegen Baiyshov</tspan><tspan fill="#8b949e"> — </tspan><tspan fill="#e6edf3">Junior Backend Developer, 20</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.4s" fill="freeze"/>
  </text>

  <g clip-path="url(#c2)">
    <text x="40" y="144"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> cat stack.txt</tspan></text>
  </g>
  <text x="40" y="174" opacity="0" fill="#d2a8ff">
    Python · Django · FastAPI · PostgreSQL · Redis · Docker
    <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.4s" fill="freeze"/>
  </text>

  <g clip-path="url(#c3)">
    <text x="40" y="208"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> ./status --now</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.8s" dur="0.4s" fill="freeze"/>
    <circle cx="46" cy="232" r="5" fill="#3fb950">
      <animate attributeName="r" values="5;8;5" dur="1.6s" begin="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" begin="4.8s" repeatCount="indefinite"/>
    </circle>
    <text x="60" y="238" fill="#e6edf3">available for work<tspan fill="#8b949e">  ·  Bishkek, KG  ·  remote-friendly</tspan></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="5.5s" dur="0.1s" fill="freeze"/>
    <text x="40" y="278" fill="#3fb950">$</text>
    <rect x="58" y="263" width="10" height="20" fill="#e6edf3">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
