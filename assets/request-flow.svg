<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect x="0.5" y="0.5" width="839" height="219" rx="12" fill="#0d1117" stroke="#30363d"/>

  <g fill="none" stroke="#30363d" stroke-width="1.5">
    <path d="M180 110 H250"/>
    <path d="M410 110 H480"/>
    <path d="M640 110 C660 110 660 70 690 70"/>
    <path d="M640 110 C660 110 660 150 690 150" stroke-dasharray="4 4"/>
  </g>

  <g font-size="14" text-anchor="middle">
    <rect x="40" y="80" width="140" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="110" y="106" fill="#e6edf3" font-weight="600">Client</text>
    <text x="110" y="126" fill="#8b949e" font-size="12">web · mobile</text>

    <rect x="250" y="80" width="160" height="60" rx="8" fill="#161b22" stroke="#58a6ff"/>
    <text x="330" y="106" fill="#e6edf3" font-weight="600">REST API</text>
    <text x="330" y="126" fill="#8b949e" font-size="12">FastAPI · Django</text>

    <rect x="480" y="80" width="160" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="560" y="106" fill="#e6edf3" font-weight="600">Service layer</text>
    <text x="560" y="126" fill="#8b949e" font-size="12">business logic</text>

    <rect x="690" y="45" width="120" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="750" y="75" fill="#e6edf3" font-weight="600">PostgreSQL</text>

    <rect x="690" y="125" width="120" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="750" y="155" fill="#e6edf3" font-weight="600">Redis</text>
  </g>

  <g font-size="12" fill="#8b949e">
    <circle cx="48" cy="196" r="4" fill="#58a6ff"/><text x="58" y="200">request</text>
    <circle cx="128" cy="196" r="4" fill="#3fb950"/><text x="138" y="200">response</text>
    <text x="800" y="200" text-anchor="end">how I build backends</text>
  </g>

  <g>
    <circle r="5" fill="#58a6ff" opacity="0">
      <set attributeName="opacity" to="1" begin="q1.begin" end="q1.end"/>
      <animateMotion id="q1" path="M180 110 H250" dur="0.6s" begin="0.3s;s3.end+0.6s"/>
    </circle>
    <circle r="5" fill="#58a6ff" opacity="0">
      <set attributeName="opacity" to="1" begin="q2.begin" end="q2.end"/>
      <animateMotion id="q2" path="M410 110 H480" dur="0.6s" begin="q1.end+0.25s"/>
    </circle>
    <circle r="5" fill="#58a6ff" opacity="0">
      <set attributeName="opacity" to="1" begin="q3.begin" end="q3.end"/>
      <animateMotion id="q3" path="M640 110 C660 110 660 70 690 70" dur="0.6s" begin="q2.end+0.25s"/>
    </circle>
    <rect x="690" y="45" width="120" height="50" rx="8" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="0.6s" begin="q3.end"/>
    </rect>
    <circle r="5" fill="#3fb950" opacity="0">
      <set attributeName="opacity" to="1" begin="s1.begin" end="s1.end"/>
      <animateMotion id="s1" path="M690 70 C660 70 660 110 640 110" dur="0.6s" begin="q3.end+0.5s"/>
    </circle>
    <circle r="5" fill="#3fb950" opacity="0">
      <set attributeName="opacity" to="1" begin="s2.begin" end="s2.end"/>
      <animateMotion id="s2" path="M480 110 H410" dur="0.6s" begin="s1.end+0.25s"/>
    </circle>
    <circle r="5" fill="#3fb950" opacity="0">
      <set attributeName="opacity" to="1" begin="s3.begin" end="s3.end"/>
      <animateMotion id="s3" path="M250 110 H180" dur="0.6s" begin="s2.end+0.25s"/>
    </circle>
    <rect x="40" y="80" width="140" height="60" rx="8" fill="none" stroke="#3fb950" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="0.6s" begin="s3.end"/>
    </rect>
  </g>
</svg>
